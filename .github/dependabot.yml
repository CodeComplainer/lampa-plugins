# Раз в месяц — одним PR на все инструменты разработки и одним на действия
# GitHub: проверки скажут, можно ли их принимать. На сами плагины это
# не влияет, у них нет зависимостей.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      groups:
          tools:
              patterns: ['*']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      # действия меняются пачкой: upload-pages-artifact, deploy-pages и
      # download-artifact передают друг другу один и тот же архив
      groups:
          actions:
              patterns: ['*']
